# Render Blueprint (frontend repository): https://render.com/docs/blueprint-spec
services:
  - type: web
    name: playlist-musique-frontend
    runtime: static
    buildCommand: npm ci && npx ng build --define "API_BASE_URL='${API_BASE_URL}'"
    staticPublishPath: ./dist/frontend/browser
    autoDeploy: true
    routes:
      # Angular client-side routing: /playlists/3 etc. must serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL of the backend + /api, e.g. https://playlist-musique-backend.onrender.com/api
      - key: API_BASE_URL
        sync: false
